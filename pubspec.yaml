name: starten_wir_a1

description: Persian-first German vocabulary trainer for Starten Wir A1.
publish_to: 'none'
version: 1.0.1+3

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.4.0
  path: ^1.9.0
  flutter_tts: ^4.0.2
  audioplayers: ^6.1.0
  file_picker: ^8.1.2
  intl: ^0.20.3
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/vocab.json
    - assets/vocab2.json
    - assets/vocab_merged.json
    - assets/conjugations.json
    - assets/plurals.json
    - assets/starten_wir_a1_cover.jpg
    - assets/starten_wir_a2_cover.jpg
