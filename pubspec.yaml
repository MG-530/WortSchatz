name: starten_wir_a1

description: Persian-first German vocabulary trainer for Starten Wir A1.
publish_to: 'none'
version: 1.0.1+3

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.4.0
  path: ^1.9.0
  flutter_tts: ^4.0.2
  file_picker: ^13.1.0
  intl: ^0.20.3
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  home_widget: ^0.10.0
  workmanager: ^0.10.10
  permission_handler: ^13.0.2
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/vocab_merged.json
    - assets/conjugations.json
    - assets/plurals.json
    - assets/examples.json
    - assets/logo.png
    - assets/starten_wir_a1_cover.jpg
    - assets/starten_wir_a2_cover.jpg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#102A43"
  adaptive_icon_foreground: "assets/icon_foreground.png"
