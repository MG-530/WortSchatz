name: starten_wir_a1

description: Persian-first German vocabulary trainer for Starten Wir A1.
publish_to: 'none'
version: 1.0.1+3

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.3+1
  path: ^1.9.0
  flutter_tts: ^4.0.2
  audioplayers: ^6.1.0
  file_picker: ^8.1.2
  intl: ^0.19.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/vocab.json
