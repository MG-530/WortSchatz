# Keep Gradle/R8 memory inside runner limits: R8 on this dependency
# graph spikes hard, and without swap (or with an uncapped heap) the
# build JVM gets killed mid-task (exit 143, "operation was canceled").
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xmx1536m
