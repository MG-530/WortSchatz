name: Android build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Set up release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          KS=android/app/wortschatz-release.keystore
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No keystore secret; continuing with debug signing."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
          # Full verification: alias must exist AND the key password must
          # work (checked via a temp-password round-trip). Anything off
          # falls back to debug signing instead of failing the build.
          TMP_PASS="WortSchatzTmp01"
          if keytool -list -alias "$KEY_ALIAS" -keystore "$KS" -storepass "$STORE_PASSWORD" > /dev/null 2>&1 \
            && keytool -keypasswd -alias "$KEY_ALIAS" -keystore "$KS" -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" -new "$TMP_PASS" > /dev/null 2>&1 \
            && keytool -keypasswd -alias "$KEY_ALIAS" -keystore "$KS" -storepass "$STORE_PASSWORD" -keypass "$TMP_PASS" -new "$KEY_PASSWORD" > /dev/null 2>&1; then
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=wortschatz-release.keystore\n' \
              "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/app/key.properties
            echo "Release signing enabled."
          else
            echo "::warning::Keystore verification failed (broken base64, wrong alias or wrong password); falling back to debug signing."
            rm -f "$KS" android/app/key.properties
          fi

      - run: flutter build apk --release
      - run: flutter build appbundle --release

      - uses: actions/upload-artifact@v5
        with:
          name: wortschatz-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v5
        with:
          name: wortschatz-aab
          path: build/app/outputs/bundle/release/app-release.aab
