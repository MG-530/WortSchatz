name: Android build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Set up release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          KS=android/app/wortschatz-release.keystore
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No keystore secret; continuing with debug signing."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
          # Verify alias + store password via openssl (works on PKCS12,
          # unlike keytool -keypasswd). Anything off falls back to
          # debug signing instead of failing the build.
          if keytool -list -alias "$KEY_ALIAS" -keystore "$KS" -storepass "$STORE_PASSWORD" > /dev/null 2>&1 \
            && openssl pkcs12 -in "$KS" -passin pass:"$STORE_PASSWORD" -nodes 2>/dev/null | grep -q "PRIVATE KEY"; then
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=wortschatz-release.keystore\n' \
              "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/app/key.properties
            echo "Release signing enabled."
          else
            echo "::warning::Keystore verification failed (broken base64, wrong alias or wrong password); falling back to debug signing."
            rm -f "$KS" android/app/key.properties
          fi

      - run: flutter build apk --release --split-per-abi
      - run: flutter build appbundle --release

      - uses: actions/upload-artifact@v5
        with:
          name: wortschatz-apk
          path: build/app/outputs/flutter-apk/app-*-release.apk

      - uses: actions/upload-artifact@v5
        with:
          name: wortschatz-aab
          path: build/app/outputs/bundle/release/app-release.aab

      # Size breakdown only (arm64); runs last so it doesn't clobber
      # the uploaded universal APK. --analyze-size needs one ABI.
      - run: flutter build apk --release --target-platform android-arm64 --analyze-size
