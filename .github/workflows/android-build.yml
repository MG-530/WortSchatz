name: Android build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Set up release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          KS=android/app/wortschatz-release.keystore
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No keystore secret; continuing with debug signing."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
          if ! keytool -list -keystore "$KS" -storepass "$STORE_PASSWORD" > /dev/null 2>&1; then
            echo "::warning::STORE_PASSWORD is wrong (or the base64 paste is broken); falling back to debug signing."
            rm -f "$KS" android/app/key.properties
          elif ! keytool -list -alias "$KEY_ALIAS" -keystore "$KS" -storepass "$STORE_PASSWORD" 2>&1 | grep -q "PrivateKeyEntry"; then
            echo "::warning::KEY_ALIAS is wrong (no such key in the store); falling back to debug signing."
            rm -f "$KS" android/app/key.properties
          elif ! openssl pkcs12 -in "$KS" -passin pass:"$STORE_PASSWORD" -nodes 2>/dev/null | grep -q "PRIVATE KEY"; then
            echo "::warning::Key password does not match; falling back to debug signing."
            rm -f "$KS" android/app/key.properties
          else
            keytool -list -keystore "$KS" -storepass "$STORE_PASSWORD" 2>&1 | grep -E "SHA-256" || true
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=wortschatz-release.keystore\n' \
              "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/app/key.properties
            echo "Release signing enabled."
          fi

      - run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v5
        with:
          name: wortschatz-apk
          path: build/app/outputs/flutter-apk/app-*-release.apk

  appbundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@v5

      # Background resource monitor: if the build gets killed again,
      # this log shows whether RAM or disk ran out (printed always).
      - name: Start resource monitor
        run: |
          (while true; do echo "--- $(date -u +%H:%M:%S)"; free -m | head -2; df -h / /tmp | tail -3; sleep 20; done > /tmp/mon.log 2>&1 &) 
          echo $! > /tmp/mon.pid
          echo started

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Set up release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          KS=android/app/wortschatz-release.keystore
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No keystore secret; continuing with debug signing."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
          if ! keytool -list -keystore "$KS" -storepass "$STORE_PASSWORD" > /dev/null 2>&1; then
            echo "::warning::STORE_PASSWORD is wrong (or the base64 paste is broken); falling back to debug signing."
            rm -f "$KS" android/app/key.properties
          elif ! keytool -list -alias "$KEY_ALIAS" -keystore "$KS" -storepass "$STORE_PASSWORD" 2>&1 | grep -q "PrivateKeyEntry"; then
            echo "::warning::KEY_ALIAS is wrong (no such key in the store); falling back to debug signing."
            rm -f "$KS" android/app/key.properties
          elif ! openssl pkcs12 -in "$KS" -passin pass:"$STORE_PASSWORD" -nodes 2>/dev/null | grep -q "PRIVATE KEY"; then
            echo "::warning::Key password does not match; falling back to debug signing."
            rm -f "$KS" android/app/key.properties
          else
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=wortschatz-release.keystore\n' \
              "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/app/key.properties
            echo "Release signing enabled."
          fi

      - run: flutter build appbundle --release

      - uses: actions/upload-artifact@v5
        with:
          name: wortschatz-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Dump resource monitor
        if: always()
        run: |
          kill $(cat /tmp/mon.pid) 2>/dev/null || true
          tail -50 /tmp/mon.log
          dmesg 2>/dev/null | grep -iE "oom|killed process" | tail -5 || true
